<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Host</title>
  <style>
    body { 
      font-family: Arial; 
      padding: 20px; 
      background: #0f0f23; 
      color: #fff; 
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 { color: #e94560; }
    input[type="file"] { 
      margin: 20px 0; 
      color: #fff; 
      background: #16213e;
      padding: 10px;
      border-radius: 5px;
      width: 90%;
    }
    button { 
      padding: 15px 40px; 
      background: #e94560; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 18px;
      cursor: pointer;
    }
    button:active { background: #c13651; }
    #preview { 
      max-width: 100%; 
      margin-top: 20px; 
      border-radius: 10px; 
      display: none; 
    }
    #url-box { 
      margin-top: 15px; 
      padding: 15px; 
      background: #16213e; 
      border-radius: 8px; 
      word-break: break-all;
      display: none;
      font-size: 14px;
    }
    #status { 
      margin-top: 15px; 
      font-size: 16px; 
      font-weight: bold;
    }
    .success { color: #4ecca3; }
    .error { color: #e94560; }
  </style>
</head>
<body>
  <h2>🖼️ Image Host</h2>
  <input type="file" id="fileInput" accept="image/*">
  <br>
  <button onclick="uploadImage()">⬆️ Upload</button>
  <div id="status"></div>
  <img id="preview">
  <div id="url-box"></div>

  <script>
    const API_URL = "https://hydrax-silent-v2.kumarkaran64373.workers.dev/api/upload";

    async function uploadImage() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Pehle image select kar!');
        return;
      }

      const status = document.getElementById('status');
      status.innerHTML = 'Uploading... ⏳';
      status.className = '';

      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          status.innerHTML = '✅ Upload Done!';
          status.className = 'success';
          
          document.getElementById('preview').src = result.url;
          document.getElementById('preview').style.display = 'block';
          
          document.getElementById('url-box').innerHTML = 
            '<strong>🔗 Image URL:</strong><br><br>' + 
            '<a href="' + result.url + '" style="color:#4ecca3;">' + result.url + '</a>';
          document.getElementById('url-box').style.display = 'block';
        } else {
          status.innerHTML = '❌ Error: ' + (result.error || 'Unknown error');
          status.className = 'error';
        }
      } catch (err) {
        status.innerHTML = '❌ Failed: ' + err.message;
        status.className = 'error';
      }
    }
  </script>
</body>
</html>
